apiVersion: v1
kind: Secret
metadata:
  name: bggdb-secret
  namespace: bggns
type: Opaque
stringData:
  password: changeit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bggapp-deploy
  namespace: bggns
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: bggapp
  template:
    metadata:
      labels:
        app: bggapp
    spec:
      containers:
      - name: bggapp
        image: stackupiss/bgg-backend:v1
        ports:
        - containerPort: 3000
        env:
        - name: BGG_DB_USER
          value: root
        - name: BGG_DB_HOST
          value: bggdb-svc.bggns.svc.cluster.local
        - name: BGG_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bggdb-secret
              key: password
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: bggapp-svc
  namespace: bggns
spec:
  type: NodePort
  selector:
    app: bggapp
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30080
